<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Woolly Weather — 3D</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,700;1,9..144,900&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg:         #12100e;
      --surface:    #1c1916;
      --surface-hi: #252119;
      --rule:       #302b25;
      --text:       #f3ede4;
      --muted:      #6e6358;
      --cta-bg:     #f3ede4;
      --cta-text:   #12100e;
      --r-input:    10px;
      --r-pill:     999px;
      --display:    'Fraunces', Georgia, serif;
      --sans:       'DM Sans', system-ui, sans-serif;
    }

    body { background: var(--bg); overflow: hidden; font-family: var(--sans); color: var(--text); }
    canvas { display: block; }

    /* ── Overlay panel ── */
    #panel {
      position: fixed;
      top: 1.25rem;
      right: 1.25rem;
      width: 272px;
      background: rgba(28, 25, 22, 0.88);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--rule);
      border-radius: 22px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      z-index: 10;
    }

    #panel h1 {
      font-family: var(--display);
      font-style: italic;
      font-weight: 900;
      font-size: 1.45rem;
      letter-spacing: -0.025em;
      line-height: 1;
      font-variation-settings: 'opsz' 72, 'WONK' 1;
      color: var(--text);
    }

    .field { display: flex; flex-direction: column; gap: 0.35rem; }

    .field label {
      font-size: 0.68rem;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    input, select {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--rule);
      border-radius: var(--r-input);
      padding: 0.55rem 0.8rem;
      font-family: var(--sans);
      font-size: 0.9rem;
      width: 100%;
      appearance: none;
      -webkit-appearance: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus { outline: none; border-color: var(--muted); }
    input::placeholder { color: var(--muted); }
    option { background: var(--surface-hi); color: var(--text); }

    .select-wrap { position: relative; }
    .select-wrap::after {
      content: '▾';
      position: absolute;
      right: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
      font-size: 0.72rem;
    }

    #place-wrapper { position: relative; }
    #place-dropdown {
      display: none;
      position: absolute;
      top: calc(100% + 5px);
      left: 0; right: 0;
      background: var(--surface-hi);
      border: 1px solid var(--rule);
      border-radius: var(--r-input);
      z-index: 20;
      max-height: 190px;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.55);
    }
    .place-opt {
      padding: 0.5rem 0.8rem;
      cursor: pointer;
      font-size: 0.83rem;
      color: var(--muted);
      border-bottom: 1px solid var(--rule);
      transition: color 0.1s, background 0.1s;
    }
    .place-opt:last-child { border-bottom: none; }
    .place-opt:hover,
    .place-opt[aria-selected="true"] { background: var(--surface); color: var(--text); }

    #year-notice {
      font-size: 0.73rem;
      color: var(--muted);
      line-height: 1.5;
      min-height: 1em;
    }

    #generate-btn {
      background: var(--cta-bg);
      color: var(--cta-text);
      border: none;
      border-radius: var(--r-pill);
      padding: 0.7rem 1rem;
      font-family: var(--display);
      font-style: italic;
      font-weight: 700;
      font-variation-settings: 'opsz' 14, 'WONK' 1;
      font-size: 1.05rem;
      letter-spacing: -0.01em;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.15s;
    }
    #generate-btn:hover    { opacity: 0.88; }
    #generate-btn:disabled { opacity: 0.35; cursor: not-allowed; }

    #status {
      font-size: 0.73rem;
      color: var(--muted);
      line-height: 1.5;
      min-height: 1em;
    }
    #status.error { color: #d95f5f; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
</head>
<body>

  <!-- ── Control panel ── -->
  <div id="panel">
    <h1>Woolly Weather</h1>

    <div class="field">
      <label for="place-input">Place</label>
      <div id="place-wrapper">
        <input type="text" id="place-input"
               placeholder="Start typing a place…"
               autocomplete="off"
               aria-autocomplete="list"
               aria-controls="place-dropdown">
        <div id="place-dropdown" role="listbox"></div>
      </div>
    </div>

    <div class="field">
      <label for="year-select">Year</label>
      <div class="select-wrap">
        <select id="year-select"></select>
      </div>
    </div>

    <div id="year-notice"></div>

    <button id="generate-btn">Generate blanket</button>

    <div id="status"></div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three":         "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="./main.js"></script>

</body>
</html>
